<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>企業の健全性ライン診断</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial; margin:0; background:#f5f6f8; color:#111}
.wrap{max-width:720px; margin:0 auto; padding:16px}
.card{background:#fff; border-radius:14px; padding:18px; box-shadow:0 2px 12px rgba(0,0,0,.06); margin:14px 0}
h1{font-size:20px; margin:0 0 8px}
h2{font-size:16px; margin:0 0 10px}
.q{margin:14px 0}
.q label{display:block; padding:10px 12px; border:1px solid #e5e7eb; border-radius:10px; margin:8px 0; cursor:pointer}
.q input{margin-right:8px}
.btn{width:100%; padding:12px; border-radius:12px; border:0; cursor:pointer; font-weight:700; font-size:15px}
.btnPrimary{background:#111; color:#fff}
.btnGhost{background:#fff; border:1px solid #e5e7eb}
.muted{color:#6b7280; font-size:13px}
.pill{display:inline-block; padding:6px 10px; border-radius:999px; font-weight:700; font-size:13px}
.danger{background:#fee2e2}
.warn{background:#fef3c7}
.safe{background:#dcfce7}
.type{background:#e0e7ff}
.input, select{width:100%; padding:12px; border-radius:12px; border:1px solid #e5e7eb; font-size:15px; margin-top:8px}
.check label{display:flex; gap:8px; align-items:flex-start; padding:10px 12px; border:1px solid #e5e7eb; border-radius:10px; margin:8px 0; cursor:pointer}
.hide{display:none}
ul{margin:10px 0 0 18px}
</style>
</head>

<body>
<div class="wrap">

<div class="card">
<h1>企業の健全性ライン診断（3分）</h1>
<div class="muted">簡易判定です。入力内容は保存されません。</div>
</div>

<div class="card" id="diagCard">
<h2>簡易診断</h2>

<div class="q">
<b>Q1. 手元資金は固定費の何か月分ありますか？</b>
<label><input type="radio" name="cash" value="0">1ヶ月未満</label>
<label><input type="radio" name="cash" value="1">1〜3ヶ月</label>
<label><input type="radio" name="cash" value="2">3ヶ月以上</label>
</div>

<div class="q">
<b>Q2. 借入返済は余裕がありますか？</b>
<label><input type="radio" name="debt" value="0">きつい</label>
<label><input type="radio" name="debt" value="1">普通</label>
<label><input type="radio" name="debt" value="2">問題ない</label>
</div>

<div class="q">
<b>Q3. ここ1年の利益は？</b>
<label><input type="radio" name="profit" value="0">赤字</label>
<label><input type="radio" name="profit" value="1">トントン</label>
<label><input type="radio" name="profit" value="2">黒字</label>
</div>

<button class="btn btnPrimary" onclick="runJudge()">判定する</button>
</div>

<div class="card hide" id="resultCard">
<h2>判定結果</h2>

<div id="resultBadges"></div>
<div id="resultText" style="margin-top:10px;"></div>

<div class="card" style="box-shadow:none; border:1px solid #e5e7eb; margin-top:12px;">
  <b>このタイプで確認すると速いポイント</b>
  <ul id="points"></ul>
</div>

<div style="margin-top:18px;">
  <button class="btn btnGhost" onclick="location.reload()">入力をやり直す</button>
</div>
</div>

<div class="card hide" id="leadCard">
<h2>詳細診断（任意）</h2>
<div class="muted">より詳細な分析をご希望の場合はご連絡ください。</div>

<input class="input" id="email" type="email" placeholder="メール（任意）">

<select id="industry">
<option value="">業種（任意）</option>
<option>建設</option>
<option>製造</option>
<option>医療・介護</option>
<option>不動産</option>
<option>飲食</option>
<option>IT・サービス</option>
<option>その他</option>
</select>

<div style="margin-top:12px;"><b>相談テーマ（任意）</b></div>
<div class="check">
<label><input type="checkbox">資金繰り</label>
<label><input type="checkbox">借入返済</label>
<label><input type="checkbox">事業継続対策</label>
<label><input type="checkbox">福利厚生整備</label>
<label><input type="checkbox">決算前対策</label>
</div>

<button class="btn btnPrimary" style="margin-top:10px;">送信（後日連絡）</button>
</div>

</div>

<script>
function getChecked(name){
  const el=document.querySelector(`input[name="${name}"]:checked`);
  return el ? parseInt(el.value,10) : null;
}

function calcRiskLevel(cash,debt,profit){
  // 危険：資金<1ヶ月 or (赤字 and 返済きつい)
  if(cash===0 || (profit===0 && debt===0)) return "危険";
  // 安全：資金>=3ヶ月 and 黒字 and 返済余裕
  if(cash===2 && debt===2 && profit===2) return "安全";
  // その他
  return "要注意";
}

function calcType(cash,debt,profit){
  // 優先順位：資金ショート > 返済圧迫 > 収益不安 > バランス/資金耐久
  if(cash===0) return "資金ショート型";
  if(debt===0) return "返済圧迫型";
  if(profit===0 || profit===1) return "収益不安型";
  if(cash===2) return "資金耐久型";
  return "バランス型";
}

function typePoints(type){
  switch(type){
    case "資金ショート型":
      return [
        "固定費（人件費・家賃・外注費）の把握と、何ヶ月耐えられるか",
        "売掛回収と支払いサイトのズレ（回収が遅いほど危険）",
        "『止まった瞬間』に必要になる資金の金額感（最低ライン）"
      ];
    case "返済圧迫型":
      return [
        "年間返済額と、毎月の資金残の推移（返済日後にマイナスにならないか）",
        "借入の条件（期間・金利・返済方法）と、見直し余地",
        "設備投資・税金支払いなど“ドン”と出る月の把握"
      ];
    case "収益不安型":
      return [
        "粗利率（値上げ/外注/仕入れの影響）と、利益が落ちた要因",
        "固定費の見直し余地（1割削減で何が変わるか）",
        "赤字が『一時的』か『構造的』か（原因が消えるか）"
      ];
    case "資金耐久型":
      return [
        "現預金が厚いほど狙われるリスク（突発損失・事故・訴訟・災害など）の整理",
        "代表者/キーマン不在で止まる業務がどこか",
        "成長投資の優先順位（攻めるなら守りもセット）"
      ];
    default:
      return [
        "資金（手元）・返済・利益の3点のどこがボトルネックか",
        "月次で見たい数字（売上/粗利/固定費/資金残）",
        "決算期前に“守り”の論点を洗い出す"
      ];
  }
}

function badgeHtml(level){
  if(level==="危険") return '<span class="pill danger">🔴 危険</span>';
  if(level==="安全") return '<span class="pill safe">🟢 安全</span>';
  return '<span class="pill warn">🟡 要注意</span>';
}

function runJudge(){
  const cash=getChecked("cash");
  const debt=getChecked("debt");
  const profit=getChecked("profit");
  if(cash===null||debt===null||profit===null){
    alert("すべて選択してください。");
    return;
  }

  const level=calcRiskLevel(cash,debt,profit);
  const type=calcType(cash,debt,profit);

  const badges = badgeHtml(level) + ' <span class="pill type">🧩 ' + type + '</span>';
  document.getElementById("resultBadges").innerHTML = badges;

  let text="";
  if(level==="危険") text="短期的な資金の詰まり（または返済圧迫）の可能性があります。早期に状況整理を推奨します。";
  else if(level==="安全") text="現状は健全です。タイプに合わせて、弱点がないかだけ確認すると安心です。";
  else text="現状は維持されていますが、外部環境変化に備えて弱点の点検が有効です。";
  document.getElementById("resultText").innerHTML = text;

  const pts = typePoints(type);
  const ul = document.getElementById("points");
  ul.innerHTML="";
  pts.forEach(p => ul.innerHTML += `<li>${p}</li>`);

  document.getElementById("resultCard").classList.remove("hide");
  document.getElementById("leadCard").classList.remove("hide");
  window.scrollTo({top:document.getElementById("resultCard").offsetTop,behavior:"smooth"});
}
</script>
</body>
</html>
